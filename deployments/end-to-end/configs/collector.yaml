# Real SNMP inventory for client-site E2E. Replace hosts before acceptance.
# No SNMP simulator is provided in this profile.

site_id: "site-001"
poll_interval: 30s
max_workers: 10

admin:
  listen: ":9090"

snmp:
  timeout: 5s
  retries: 2

publisher:
  mode: mqtt
  timeout: 10s

buffer:
  path: "/data/buffer.db"
  max_entries: 50000
  busy_timeout_ms: 5000
  batch_size: 50
  idle_backoff: 500ms

mqtt:
  broker: "tls://mosquitto:8883"
  client_id: "e2e-collector"
  username: "collector"
  password_env: "MQTT_PASSWORD"
  qos: 1
  tls:
    ca_file: "/certs/ca.crt"
  reconnect:
    initial: 1s
    max: 60s

devices:
  - id: "do-core"
    host: "REPLACE_WITH_DEVICE_IP"
    port: 161
    community: "EquateMonitor"
    version: "2c"
    vendor: "cisco"
