# Real SNMP inventory for client-site E2E. Replace hosts and set SNMP_COMMUNITY_* env refs before acceptance.
# No SNMP simulator is provided in this profile.

site_id: "site-001"
collector:
  id: "collector-e2e"
poll_interval: 30s
max_workers: 10

admin:
  listen: ":9090"

snmp:
  timeout: 5s
  retries: 2

publisher:
  mode: mqtt
  timeout: 10s

buffer:
  path: "/data/buffer.db"
  max_entries: 50000
  busy_timeout_ms: 5000
  batch_size: 50
  idle_backoff: 500ms

mqtt:
  broker: "tls://mosquitto:8883"
  client_id: "e2e-collector"
  username: "collector"
  password_env: "MQTT_PASSWORD"
  qos: 1
  tls:
    ca_file: "/certs/ca.crt"
  reconnect:
    initial: 1s
    max: 60s

inventory:
  managed_path: "/data/managed-inventory.yaml"

devices:
  - id: "do-core"
    host: "10.255.0.1"
    port: 161
    community_env: "SNMP_COMMUNITY_DO_CORE"
    version: "2c"
    vendor: "cisco"

  - id: "site-a-mdf"
    host: "10.255.0.11"
    port: 161
    community_env: "SNMP_COMMUNITY_SITE_A_MDF"
    version: "2c"
    vendor: "cisco"

  - id: "site-a-idf1"
    host: "10.255.0.12"
    port: 161
    community_env: "SNMP_COMMUNITY_SITE_A_IDF1"
    version: "2c"
    vendor: "cisco"

  - id: "site-a-idf2"
    host: "10.255.0.13"
    port: 161
    community_env: "SNMP_COMMUNITY_SITE_A_IDF2"
    version: "2c"
    vendor: "cisco"

  - id: "site-b-mdf"
    host: "10.255.0.21"
    port: 161
    community_env: "SNMP_COMMUNITY_SITE_B_MDF"
    version: "2c"
    vendor: "cisco"

  - id: "site-c-mdf"
    host: "10.255.0.31"
    port: 161
    community_env: "SNMP_COMMUNITY_SITE_C_MDF"
    version: "2c"
    vendor: "cisco"

  - id: "site-c-idf1"
    host: "10.255.0.32"
    port: 161
    community_env: "SNMP_COMMUNITY_SITE_C_IDF1"
    version: "2c"
    vendor: "cisco"
