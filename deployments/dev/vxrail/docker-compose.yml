# GNS3 / on-prem VxRail plane: SNMP collector only
#
# MQTT_BROKER must point at the Azure Mosquitto endpoint (dev/cloud).
# For Mac Mosquitto day-to-day testing, use deployments/local/vxrail.
# No snmpsim — use live C7200 inventory in configs/collector.yaml.

name: ogsd-dev-vxrail

services:
  snmp-collector:
    build: ../../../services/snmp-collector
    command: ["-config", "/configs/collector.yaml"]
    user: "0:0"
    environment:
      MQTT_BROKER: ${MQTT_BROKER:?Set MQTT_BROKER to tls://<azure-host>:8883}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-secret}
    volumes:
      - ./configs/collector.yaml:/configs/collector.yaml:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - collector-data:/data
    ports:
      - "${COLLECTOR_ADMIN_PORT:-9090}:9090"
    restart: unless-stopped

volumes:
  collector-data:
