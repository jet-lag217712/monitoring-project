# Production VxRail: on-site SNMP collector → Azure Mosquitto.
# Skeleton: builds from repo path; switch to registry images before real deploy.

name: ogsd-production-vxrail

services:
  snmp-collector:
    build: ../../../services/snmp-collector
    command: ["-config", "/configs/collector.yaml"]
    # Image USER is distroless nonroot (65532). State volume must be writable by that UID.
    user: "65532:65532"
    environment:
      MQTT_BROKER: ${MQTT_BROKER:?}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:?}
      SNMP_DISCOVERY_COMMUNITY: ${SNMP_DISCOVERY_COMMUNITY:-${SNMP_COMMUNITY:?}}
    volumes:
      - ./configs/collector.yaml:/configs/collector.yaml:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - collector-state:/var/lib/snmp-collector
      - ./managed:/var/lib/snmp-collector/managed
      - ./run:/run/snmp-collector
    ports:
      # Optional scrape/liveness only; control socket is Unix and not published.
      - "${COLLECTOR_ADMIN_PORT:-9090}:9090"
    restart: unless-stopped

volumes:
  collector-state:
