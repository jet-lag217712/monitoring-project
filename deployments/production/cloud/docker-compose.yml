# Production cloud plane (Azure VM) — skeleton.
# Replace CHANGE_ME secrets, mount trusted TLS material, and prefer registry images later.
# No development credential defaults.

name: ogsd-production-cloud

services:
  mosquitto:
    build: ../../../infrastructure/docker/mqtt-broker
    ports:
      - "${MQTT_HOST_PORT:-8883}:8883"
    volumes:
      - ./certs:/mosquitto/certs:ro
      - ./secrets/mosquitto.passwd:/mosquitto/config/passwords:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ingestion:
    build: ../../../services/ingestion-service
    command: ["-config", "/configs/ingestion.yaml"]
    environment:
      MQTT_BROKER: tls://mosquitto:8883
      MQTT_PASSWORD: ${MQTT_INGESTION_PASSWORD:?}
      DATABASE_URL: postgres://${OGSD_INGESTION_USER:?}:${OGSD_INGESTION_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    volumes:
      - ./configs/ingestion.yaml:/configs/ingestion.yaml:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
    ports:
      - "${INGESTION_ADMIN_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  backend-api:
    build: ../../../services/backend-api
    command: ["-config", "/configs/api.yaml"]
    environment:
      DATABASE_URL: postgres://${OGSD_API_USER:?}:${OGSD_API_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
    volumes:
      - ./configs/api.yaml:/configs/api.yaml:ro
    ports:
      - "${API_HOST_PORT:-8000}:8000"
      - "${API_ADMIN_PORT:-9092}:9092"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../../../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_DEMO_ENABLED: ${VITE_DEMO_ENABLED:-false}
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  mosquitto-data:
  postgres-data:
