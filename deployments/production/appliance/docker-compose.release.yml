# Production appliance runtime compose (bundled in offline releases).
# Image-only: no build contexts. Images are loaded from release tarballs on the VM.

name: equate-appliance

x-collector-common: &collector-common
  image: ${EQUATE_COLLECTOR_IMAGE:?}
  command: ["-config", "/configs/collector.yaml"]
  user: "65532:65532"
  environment:
    MQTT_BROKER: ${MQTT_BROKER:?}
    MQTT_PASSWORD: ${MQTT_PASSWORD:?}
    SNMP_COMMUNITY: ${SNMP_COMMUNITY:?}
    SNMP_DISCOVERY_COMMUNITY: ${SNMP_DISCOVERY_COMMUNITY:-${SNMP_COMMUNITY:?}}
  restart: unless-stopped
  networks: [core, oob]
  pull_policy: never

services:
  postgres:
    image: ${EQUATE_POSTGRES_IMAGE:?}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - ${EQUATE_POSTGRES_DATA:?}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [core]
    pull_policy: never

  migrate:
    image: ${EQUATE_MIGRATE_IMAGE:?}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    entrypoint: ["/bin/sh", "-c"]
    command: ['migrate -path /migrations -database "$$DATABASE_URL" up']
    volumes:
      - ${EQUATE_MIGRATIONS_DIR:?}:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]
    restart: "no"
    pull_policy: never

  mosquitto:
    image: ${EQUATE_MOSQUITTO_IMAGE:?}
    volumes:
      - ${EQUATE_MQTT_CERTS:?}:/mosquitto/certs:ro
      - ${EQUATE_MQTT_PASSWORDS:?}:/mosquitto/config/passwords:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
    networks: [core, oob]
    pull_policy: never

  ingestion:
    image: ${EQUATE_INGESTION_IMAGE:?}
    command: ["-config", "/configs/ingestion.yaml"]
    environment:
      MQTT_BROKER: tls://mosquitto:8883
      MQTT_PASSWORD: ${MQTT_INGESTION_PASSWORD:?}
      DATABASE_URL: postgres://${OGSD_INGESTION_USER:?}:${OGSD_INGESTION_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    volumes:
      - ./configs/ingestion.yaml:/configs/ingestion.yaml:ro
      - ${EQUATE_MQTT_CA:?}:/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    networks: [core]
    pull_policy: never

  backend-api:
    image: ${EQUATE_BACKEND_API_IMAGE:?}
    command: ["-config", "/configs/api.yaml"]
    environment:
      DATABASE_URL: postgres://${OGSD_API_USER:?}:${OGSD_API_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    volumes:
      - ./configs/api.yaml:/configs/api.yaml:ro
      - ${EQUATE_AUTH_SOCKET_DIR:?}:/run/equate
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [core]
    pull_policy: never

  frontend:
    image: ${EQUATE_FRONTEND_IMAGE:?}
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EQUATE_UI_CERTS:?}:/etc/nginx/certificates:ro
    ports:
      - "${FRONTEND_HOST_PORT:-443}:443"
      - "${FRONTEND_HTTP_PORT:-80}:80"
    depends_on:
      - backend-api
    restart: unless-stopped
    networks: [core, edge]
    pull_policy: never

networks:
  core:
    internal: true
  edge:
  # Collectors must reach customer SNMP subnets via the host route table.
  # internal: true blocks all outbound traffic from this network.
  oob:

volumes:
  mosquitto-data:
  postgres-data:
