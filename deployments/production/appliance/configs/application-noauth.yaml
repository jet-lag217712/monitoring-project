# First-boot defaults for the isolated NoAuth appliance edition. The dashboard
# and monitoring API rely on the appliance network boundary and TLS, not an
# external identity provider.
site_id: appliance
poll_interval: 60s
max_workers: 10

api:
  listen: ":8000"
  cors_origins: ""

auth:
  enabled: false
  mode: disabled

collector:
  id: equate-appliance
  heartbeat_interval: 60s

database:
  url_env: DATABASE_URL
  max_conns: 10
  min_conns: 1
  max_lifetime: 1h

inventory:
  managed_path: /var/lib/equate/core/managed-inventory.yaml

health:
  temperature_warning_c: 65
  failure_threshold: 2

discovery:
  allowed_cidrs: []
  community_env: SNMP_DISCOVERY_COMMUNITY
  max_targets: 1024
  timeout: 5s
  retries: 1
  max_workers: 10
  max_probes_per_second: 5
  probe_burst: 5

admin:
  listen: "127.0.0.1:9090"
  control_socket: /run/equate/sockets/poller.sock

snmp:
  timeout: 5s
  retries: 2

publisher:
  mode: inprocess
  timeout: 10s
  telemetry_version: v2

buffer:
  path: /var/lib/equate/core/events.db
  max_entries: 50000
  busy_timeout_ms: 5000
  batch_size: 50
  idle_backoff: 500ms

devices: []
