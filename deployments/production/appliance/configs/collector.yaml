# Appliance per-site collector template. Site identity is applied during setup.

site_id: "site-001"
collector:
  id: "collector-appliance"
  heartbeat_interval: 60s
poll_interval: 30s
max_workers: 10

admin:
  listen: ":9090"
  control_socket: "/run/snmp-collector/control.sock"

snmp:
  timeout: 5s
  retries: 2

publisher:
  mode: mqtt
  timeout: 10s
  telemetry_version: v2

buffer:
  path: "/var/lib/snmp-collector/buffer.db"
  max_entries: 50000
  busy_timeout_ms: 5000
  batch_size: 50
  idle_backoff: 500ms

mqtt:
  broker: "tls://mosquitto:8883"
  client_id: "appliance-collector"
  username: "collector"
  password_env: "MQTT_PASSWORD"
  qos: 1
  tls:
    ca_file: "/certs/ca.crt"
  reconnect:
    initial: 1s
    max: 60s

inventory:
  managed_path: "/var/lib/snmp-collector/managed/managed-inventory.yaml"

discovery:
  community_env: "SNMP_DISCOVERY_COMMUNITY"
  max_targets: 256
  timeout: 2s
  retries: 0
  max_workers: 4
  max_probes_per_second: 5
  probe_burst: 2

devices: []
