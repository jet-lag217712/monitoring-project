# On-prem appliance: full stack on one VM. Per-site collectors generated at setup.
# See bootstrapper.sh and equate configure for first-boot / reconfigure.
#
# Production bundles set EQUATE_*_IMAGE in release.env (pinned digests). Local dev
# omits those vars and builds from ../../../ service paths instead.

name: equate-appliance

x-collector-common: &collector-common
  image: ${EQUATE_COLLECTOR_IMAGE:-equate-snmp-collector:local}
  build: ../../../services/snmp-collector
  command: ["-config", "/configs/collector.yaml"]
  user: "65532:65532"
  environment:
    MQTT_BROKER: ${MQTT_BROKER:?}
    MQTT_PASSWORD: ${MQTT_PASSWORD:?}
    SNMP_COMMUNITY: ${SNMP_COMMUNITY:?}
    SNMP_DISCOVERY_COMMUNITY: ${SNMP_DISCOVERY_COMMUNITY:-${SNMP_COMMUNITY:?}}
  restart: unless-stopped
  networks: [core, oob]
  pull_policy: ${EQUATE_PULL_POLICY:-build}

services:
  postgres:
    image: ${EQUATE_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - ${EQUATE_POSTGRES_DATA:-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [core]
    pull_policy: ${EQUATE_PULL_POLICY:-missing}

  migrate:
    image: ${EQUATE_MIGRATE_IMAGE:-migrate/migrate:v4.18.1}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    entrypoint: ["/bin/sh", "-c"]
    command: ['migrate -path /migrations -database "$$DATABASE_URL" up']
    volumes:
      - ${EQUATE_MIGRATIONS_DIR:-../../../database/migrations}:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]
    restart: "no"
    pull_policy: ${EQUATE_PULL_POLICY:-missing}

  mosquitto:
    image: ${EQUATE_MOSQUITTO_IMAGE:-equate-mosquitto:local}
    build: ../../../infrastructure/docker/mqtt-broker
    volumes:
      - ${EQUATE_MQTT_CERTS:-./certs}:/mosquitto/certs:ro
      - ${EQUATE_MQTT_PASSWORDS:-./secrets/mosquitto.passwd}:/mosquitto/config/passwords:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
    networks: [core, oob]
    pull_policy: ${EQUATE_PULL_POLICY:-build}

  ingestion:
    image: ${EQUATE_INGESTION_IMAGE:-equate-ingestion:local}
    build: ../../../services/ingestion-service
    command: ["-config", "/configs/ingestion.yaml"]
    environment:
      MQTT_BROKER: tls://mosquitto:8883
      MQTT_PASSWORD: ${MQTT_INGESTION_PASSWORD:?}
      DATABASE_URL: postgres://${OGSD_INGESTION_USER:?}:${OGSD_INGESTION_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    volumes:
      - ./configs/ingestion.yaml:/configs/ingestion.yaml:ro
      - ${EQUATE_MQTT_CA:-./certs/ca.crt}:/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    networks: [core]
    pull_policy: ${EQUATE_PULL_POLICY:-build}

  backend-api:
    image: ${EQUATE_BACKEND_API_IMAGE:-equate-backend-api:local}
    build: ../../../services/backend-api
    command: ["-config", "/configs/api.yaml"]
    environment:
      DATABASE_URL: postgres://${OGSD_API_USER:?}:${OGSD_API_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable
    volumes:
      - ./configs/api.yaml:/configs/api.yaml:ro
      - ${EQUATE_AUTH_SOCKET_DIR:-/run/equate}:/run/equate
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [core]
    pull_policy: ${EQUATE_PULL_POLICY:-build}

  frontend:
    image: ${EQUATE_FRONTEND_IMAGE:-equate-frontend:local}
    build:
      context: ../../../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-appliance_local}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_DEMO_ENABLED: ${VITE_DEMO_ENABLED:-false}
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EQUATE_UI_CERTS:-./certs/ui}:/etc/nginx/certificates:ro
    ports:
      - "${FRONTEND_HOST_PORT:-443}:443"
      - "${FRONTEND_HTTP_PORT:-80}:80"
    depends_on:
      - backend-api
    restart: unless-stopped
    networks: [core, edge]
    pull_policy: ${EQUATE_PULL_POLICY:-build}

networks:
  core:
    internal: true
  edge:
  # Collectors must reach customer SNMP subnets via the host route table.
  # internal: true blocks all outbound traffic from this network.
  oob:

volumes:
  mosquitto-data:
  postgres-data:
