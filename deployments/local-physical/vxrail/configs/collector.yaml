# Physical-network inventory template (pre-client E2E).
# Replace REPLACE_WITH_* hosts and communities before running.
# Do not commit real site secrets — use SNMP_COMMUNITY_<DEVICE_ID> env overrides.
#
# Host-run uses collector.host.yaml (same devices; different paths).
# MQTT_BROKER env overrides mqtt.broker.

site_id: "physical-lab-001"
poll_interval: 30s
max_workers: 10

admin:
  listen: ":9090"

snmp:
  timeout: 5s
  retries: 2

publisher:
  mode: mqtt
  timeout: 10s

buffer:
  path: "/data/buffer.db"
  max_entries: 50000
  busy_timeout_ms: 5000
  batch_size: 50
  idle_backoff: 500ms

mqtt:
  broker: "tls://127.0.0.1:8883"
  client_id: "local-physical-vxrail"
  username: "collector"
  password_env: "MQTT_PASSWORD"
  qos: 1
  tls:
    ca_file: "/certs/ca.crt"
  reconnect:
    initial: 1s
    max: 60s

devices:
  - id: "core-sw1"
    host: "REPLACE_WITH_DEVICE_IP"
    port: 161
    community: "REPLACE_WITH_COMMUNITY"
    version: "2c"
    vendor: ""
  - id: "access-sw1"
    host: "REPLACE_WITH_DEVICE_IP"
    port: 161
    community: "REPLACE_WITH_COMMUNITY"
    version: "2c"
    vendor: ""
