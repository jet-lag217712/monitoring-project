# SSH remains installed for recovery but is off until explicitly enabled by the
# appliance console. The equate account cannot obtain a Linux shell or SFTP.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitRootLogin no
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
Subsystem sftp /bin/false
AllowUsers equate

Match User equate
    ForceCommand /usr/local/bin/equate
    PermitTTY yes
    AllowTcpForwarding no
    X11Forwarding no
    DisableForwarding yes
