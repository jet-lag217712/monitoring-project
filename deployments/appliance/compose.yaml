# This file is copied unchanged into /opt/equate/releases/<version>/compose.yaml.
# Images are loaded from that immutable release; no build directives or customer
# secrets belong in this runtime bundle.
name: equate

services:
  postgres:
    image: ${EQUATE_POSTGRES_IMAGE:?release image is required}
    env_file:
      - /run/equate/rendered/postgres.env
    volumes:
      - /var/lib/equate/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    pull_policy: never
    networks: [core]

  migrate:
    image: ${EQUATE_MIGRATE_IMAGE:?release image is required}
    env_file:
      - /run/equate/rendered/database-admin.env
    command: ["-path", "/migrations", "-database", "${DATABASE_URL:?database URL is required}", "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]
    restart: "no"
    pull_policy: never

  api:
    image: ${EQUATE_API_IMAGE:?release image is required}
    command: ["-config", "/etc/equate/application.yaml"]
    env_file:
      - /run/equate/rendered/api.env
    volumes:
      - /etc/equate/application.yaml:/etc/equate/application.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    pull_policy: never
    networks: [core]

  equate-core:
    image: ${EQUATE_CORE_IMAGE:?release image is required}
    command: ["-config", "/etc/equate/application.yaml"]
    env_file:
      - /run/equate/rendered/core.env
    volumes:
      - /etc/equate/application.yaml:/etc/equate/application.yaml:ro
      - /var/lib/equate/core:/var/lib/equate/core
      - /run/equate/sockets:/run/equate/sockets
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    pull_policy: never
    networks: [core, oob]

  ui:
    image: ${EQUATE_UI_IMAGE:?release image is required}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /run/equate/rendered/certificates:/etc/nginx/certificates:ro
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    pull_policy: never
    networks: [core, edge]

networks:
  core:
    internal: true
  edge:
    driver: bridge
  # The poller alone joins this bridge to reach configured SNMP targets.
  oob:
    driver: bridge
