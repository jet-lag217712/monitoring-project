api:
  listen: ":8000"
  cors_origins: ""

admin:
  listen: "127.0.0.1:9092"

auth:
  enabled: true
  mode: "local"
  cookie_name: "__Host-equate_session"
  session_ttl: 12h
  cookie_secure: true

database:
  url_env: "DATABASE_URL"
  max_conns: 10
  min_conns: 1
  max_lifetime: 1h

online_threshold: 5m
