# Phase 2 local dependencies: snmpsim + Mosquitto MQTT/TLS
#
# From repo root (Docker Desktop):
#   ./deployments/local/phase2/up.sh
#   ./deployments/local/phase2/down.sh
#
# Or:
#   docker compose -f deployments/local/phase2/docker-compose.yaml up --build -d

name: ogsd-phase2

services:
  snmpsim:
    build: ../snmpsim
    ports:
      - "1161:1161/udp"
    restart: unless-stopped

  mosquitto:
    build: ../../../infrastructure/docker/mqtt-broker
    ports:
      - "8883:8883"
    volumes:
      - ../../../infrastructure/docker/mqtt-broker/certs:/mosquitto/certs:ro
      - ../../../infrastructure/docker/mqtt-broker/passwords:/mosquitto/config/passwords:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  mosquitto-data:
