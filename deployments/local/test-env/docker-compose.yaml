# Local test-env stack: snmpsim + Mosquitto + Postgres
#
# From repo root:
#   ./deployments/local/test-env/up.sh
#   ./deployments/local/test-env/down.sh
#
# Schema is applied by golang-migrate (see up.sh), not docker-entrypoint-initdb.d.

name: ogsd-test-env

services:
  snmpsim:
    build: ../snmpsim
    ports:
      - "1161:1161/udp"
    restart: unless-stopped

  mosquitto:
    build: ../../../infrastructure/docker/mqtt-broker
    ports:
      - "8883:8883"
    volumes:
      - ../../../infrastructure/docker/mqtt-broker/certs:/mosquitto/certs:ro
      - ../../../infrastructure/docker/mqtt-broker/passwords:/mosquitto/config/passwords:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ogsd
      POSTGRES_PASSWORD: ogsd
      POSTGRES_DB: ogsd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogsd -d ogsd"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  mosquitto-data:
  postgres-data:
