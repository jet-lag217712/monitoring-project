# Development VxRail: on-site SNMP collectors → Mac Mosquitto (OrbStack/GNS3 lab).
# Per-site services are generated into docker-compose.sites.generated.yml by setup/bootstrap.
# Builds from repo path on the VM; see parent development/README.md.

name: ogsd-development-vxrail

# Shared collector image definition; site-specific services are generated at bootstrap.
x-collector-common: &collector-common
  build: ../../../services/snmp-collector
  command: ["-config", "/configs/collector.yaml"]
  user: "65532:65532"
  environment:
    MQTT_BROKER: ${MQTT_BROKER:?}
    MQTT_PASSWORD: ${MQTT_PASSWORD:?}
    SNMP_COMMUNITY: ${SNMP_COMMUNITY:?}
    SNMP_DISCOVERY_COMMUNITY: ${SNMP_DISCOVERY_COMMUNITY:-${SNMP_COMMUNITY:?}}
  restart: unless-stopped

services: {}

volumes: {}
