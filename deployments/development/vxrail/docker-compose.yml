# Development VxRail: on-site SNMP collector → Mac Mosquitto (OrbStack/GNS3 lab).
# Builds from repo path on the VM; see parent development/README.md.

name: ogsd-development-vxrail

services:
  snmp-collector:
    build: ../../../services/snmp-collector
    command: ["-config", "/configs/collector.yaml"]
    # Image USER is distroless nonroot (65532). State volume must be writable by that UID.
    user: "65532:65532"
    environment:
      MQTT_BROKER: ${MQTT_BROKER:?}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?}
      SNMP_COMMUNITY_DO_CORE: ${SNMP_COMMUNITY_DO_CORE:?}
      SNMP_COMMUNITY_SITE_A_MDF: ${SNMP_COMMUNITY_SITE_A_MDF:?}
      SNMP_COMMUNITY_SITE_A_IDF1: ${SNMP_COMMUNITY_SITE_A_IDF1:?}
      SNMP_COMMUNITY_SITE_A_IDF2: ${SNMP_COMMUNITY_SITE_A_IDF2:?}
      SNMP_COMMUNITY_SITE_B_MDF: ${SNMP_COMMUNITY_SITE_B_MDF:?}
      SNMP_COMMUNITY_SITE_C_MDF: ${SNMP_COMMUNITY_SITE_C_MDF:?}
      SNMP_COMMUNITY_SITE_C_IDF1: ${SNMP_COMMUNITY_SITE_C_IDF1:?}
    volumes:
      - ./configs/collector.yaml:/configs/collector.yaml:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - collector-state:/var/lib/snmp-collector
      - ./run:/run/snmp-collector
    ports:
      # Optional scrape/liveness only; control socket is Unix and not published.
      - "${COLLECTOR_ADMIN_PORT:-9090}:9090"
    restart: unless-stopped

volumes:
  collector-state:
