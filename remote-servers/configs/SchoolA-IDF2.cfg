!
! 
! Device   : SchoolA-IDF2
! Role     : School A - IDF Wing 2
! Lo0      : 10.1.0.3/32
! GNS3     : Slot0=IO-FE  (only 1 port needed)
! 
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SchoolA-IDF2
!
enable secret cisco123
!
no aaa new-model
memory-size iomem 5
!
ip cef
no ip domain lookup
!
interface Loopback0
 description SchoolA-IDF2 Management Loopback
 ip address 10.1.0.3 255.255.255.255
!
interface FastEthernet0/0
 description Uplink :: SchoolA-IDF2 ==> SchoolA-MDF
 ip address 10.1.2.2 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.1.2.1
!
snmp-server community equate_ro RO
snmp-server community equate_rw RW
snmp-server location School A - IDF2 Building Wing 2
snmp-server contact noc@equate.org
snmp-server chassis-id SchoolA-IDF2
snmp-server enable traps snmp authentication linkdown linkup coldstart warmstart
snmp-server enable traps config
snmp-server enable traps syslog
snmp-server host 172.16.100.100 version 2c equate_ro
snmp ifmib ifindex persist
!
logging buffered 16384
logging console informational
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 password cisco123
 login
 transport input telnet
!
end
