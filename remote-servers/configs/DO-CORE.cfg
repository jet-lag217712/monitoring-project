!
! 
! Device   : DO-CORE
! Role     : District Office - Core Router
! BGP AS   : 65000
! Lo0      : 1.1.1.1/32
! GNS3     : Slot0=IO-FE  Slot1=PA-FE-TX  Slot2=PA-FE-TX
! 
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname DO-CORE
!
enable secret cisco123
!
no aaa new-model
memory-size iomem 5
!
ip cef
no ip domain lookup
!
! ----- Interfaces -----
!
interface Loopback0
 description DO Management Loopback
 ip address 1.1.1.1 255.255.255.255
!
interface FastEthernet0/0
 description WAN :: DO-CORE ==> SchoolA-MDF
 ip address 10.255.1.1 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
interface FastEthernet1/0
 description WAN :: DO-CORE ==> SchoolB-MDF
 ip address 10.255.2.1 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
interface FastEthernet2/0
 description WAN :: DO-CORE ==> SchoolC-MDF
 ip address 10.255.3.1 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
! ----- Static Routes -----
! Null0 route so BGP can originate Lo0
ip route 1.1.1.1 255.255.255.255 Null0
!
! ----- BGP -----
!
router bgp 65000
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 !
 neighbor 10.255.1.2 remote-as 65001
 neighbor 10.255.1.2 description SchoolA-MDF
 neighbor 10.255.1.2 soft-reconfiguration inbound
 !
 neighbor 10.255.2.2 remote-as 65002
 neighbor 10.255.2.2 description SchoolB-MDF
 neighbor 10.255.2.2 soft-reconfiguration inbound
 !
 neighbor 10.255.3.2 remote-as 65003
 neighbor 10.255.3.2 description SchoolC-MDF
 neighbor 10.255.3.2 soft-reconfiguration inbound
 !
 address-family ipv4
  network 1.1.1.1 mask 255.255.255.255
  network 10.255.1.0 mask 255.255.255.252
  network 10.255.2.0 mask 255.255.255.252
  network 10.255.3.0 mask 255.255.255.252
  neighbor 10.255.1.2 activate
  neighbor 10.255.2.2 activate
  neighbor 10.255.3.2 activate
 exit-address-family
!
! ----- SNMP -----
! NOTE: Replace 172.16.100.100 with your SNMP Dashboard/NMS host IP
!
snmp-server community equate_ro RO
snmp-server community equate_rw RW
snmp-server location District Office - Core Router
snmp-server contact noc@equate.org
snmp-server chassis-id DO-CORE
snmp-server enable traps snmp authentication linkdown linkup coldstart warmstart
snmp-server enable traps bgp
snmp-server enable traps config
snmp-server enable traps syslog
snmp-server host 172.16.100.100 version 2c equate_ro
snmp ifmib ifindex persist
!
! ----- Logging -----
logging buffered 16384
logging console informational
!
! ----- Management Access -----
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 password cisco123
 login
 transport input telnet
!
end
