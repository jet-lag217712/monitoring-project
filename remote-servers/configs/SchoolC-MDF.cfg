!
! 
! Device   : SchoolC-MDF
! Role     : School C - Main Distribution Frame
! BGP AS   : 65003
! Lo0      : 10.3.0.1/32
! Prefix   : 10.3.0.0/22
! GNS3     : Slot0=IO-FE  Slot1=PA-FE-TX  Slot2=PA-FE-TX  Slot3=PA-FE-TX
! 
!
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SchoolC-MDF
!
enable secret cisco123
!
no aaa new-model
memory-size iomem 5
!
ip cef
no ip domain lookup
!
interface Loopback0
 description SchoolC MDF Management Loopback
 ip address 10.3.0.1 255.255.255.255
!
interface FastEthernet0/0
 description WAN :: SchoolC-MDF ==> DO-CORE
 ip address 10.255.3.2 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
interface FastEthernet1/0
 description LAN :: SchoolC-MDF ==> SchoolC-IDF1
 ip address 10.3.1.1 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
interface FastEthernet2/0
 description LAN :: SchoolC-MDF ==> SchoolC-IDF2
 ip address 10.3.2.1 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
interface FastEthernet3/0
 description LAN :: SchoolC-MDF ==> SchoolC-IDF3
 ip address 10.3.3.1 255.255.255.252
 duplex full
 speed 100
 no shutdown
!
ip route 10.3.0.2 255.255.255.255 10.3.1.2
ip route 10.3.0.3 255.255.255.255 10.3.2.2
ip route 10.3.0.4 255.255.255.255 10.3.3.2
ip route 10.3.0.0 255.255.252.0 Null0
!
router bgp 65003
 bgp router-id 10.3.0.1
 bgp log-neighbor-changes
 !
 neighbor 10.255.3.1 remote-as 65000
 neighbor 10.255.3.1 description DO-CORE
 neighbor 10.255.3.1 soft-reconfiguration inbound
 !
 address-family ipv4
  network 10.3.0.0 mask 255.255.252.0
  neighbor 10.255.3.1 activate
 exit-address-family
!
snmp-server community equate_ro RO
snmp-server community equate_rw RW
snmp-server location School C - MDF Server Room
snmp-server contact noc@equate.org
snmp-server chassis-id SchoolC-MDF
snmp-server enable traps snmp authentication linkdown linkup coldstart warmstart
snmp-server enable traps bgp
snmp-server enable traps config
snmp-server enable traps syslog
snmp-server host 172.16.100.100 version 2c equate_ro
snmp ifmib ifindex persist
!
logging buffered 16384
logging console informational
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 password cisco123
 login
 transport input telnet
!
end
