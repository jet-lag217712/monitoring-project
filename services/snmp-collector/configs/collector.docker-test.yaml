site_id: "site-001"
collector:
  id: "collector-docker-test"
poll_interval: 60s
max_workers: 1

admin:
  listen: ":9090"

snmp:
  timeout: 5s
  retries: 1

publisher:
  mode: stdout
  timeout: 10s

devices:
  - id: "dev-001"
    host: "snmpsim"
    port: 1161
    community_env: "SNMP_COMMUNITY_DEV_001"
    version: "2c"
