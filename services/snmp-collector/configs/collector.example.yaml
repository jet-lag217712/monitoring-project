site_id: "site-001"
collector:
  id: "collector-example"
  heartbeat_interval: 60s
poll_interval: 60s
max_workers: 10

admin:
  listen: ":9090"
  # Local-only operator control socket (empty disables). Prefer a RuntimeDirectory path in production.
  control_socket: ""

inventory:
  managed_path: "managed-inventory.yaml"

snmp:
  timeout: 5s
  retries: 2

discovery:
  allowed_cidrs:
    - "192.0.2.0/30"
  community_env: "SNMP_DISCOVERY_COMMUNITY"
  max_targets: 4
  timeout: 2s
  retries: 0
  max_workers: 4
  max_probes_per_second: 5
  probe_burst: 2

publisher:
  mode: stdout
  timeout: 10s
  telemetry_version: v2

devices:
  - id: "dev-001"
    host: "127.0.0.1"
    port: 161 # real devices; use 1161 only if you run a local SNMP agent for collector-only tests
    community_env: "SNMP_COMMUNITY_DEV_001"
    version: "2c"
    vendor: "" # optional metadata; sysObjectID controls profile detection
