site_id: "site-001"
collector:
  id: "collector-example"
poll_interval: 60s
max_workers: 10

admin:
  listen: ":9090"

snmp:
  timeout: 5s
  retries: 2

publisher:
  mode: stdout
  timeout: 10s

devices:
  - id: "dev-001"
    host: "127.0.0.1"
    port: 161 # real devices; use 1161 only if you run a local SNMP agent for collector-only tests
    community_env: "SNMP_COMMUNITY_DEV_001"
    version: "2c"
    vendor: "" # selects vendors/{vendor} when implemented
