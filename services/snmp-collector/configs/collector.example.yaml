site_id: "site-001"
poll_interval: 60s
max_workers: 10

admin:
  listen: ":9090"

snmp:
  timeout: 5s
  retries: 2

publisher:
    timeout: 2s

devices:
  - id: "dev-001"
    host: "127.0.0.1"
    port: 1161 # local snmpsim (see deployments/local/snmpsim); use 161 for real devices
    community: "public" # override with SNMP_COMMUNITY_DEV_001
    version: "2c"
    vendor: "" # selects vendors/{vendor} when implemented
