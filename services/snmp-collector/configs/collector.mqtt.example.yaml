site_id: "site-001"
collector:
  id: "collector-mqtt-example"
poll_interval: 30s
max_workers: 10

admin:
  listen: ":9090"

snmp:
  timeout: 5s
  retries: 2

publisher:
  mode: mqtt
  timeout: 10s

buffer:
  path: "./data/buffer.db"
  max_entries: 50000
  busy_timeout_ms: 5000
  batch_size: 50
  idle_backoff: 500ms

inventory:
  managed_path: "./data/managed-inventory.yaml"

mqtt:
  broker: "tls://127.0.0.1:8883"
  client_id: "Testing-Site-1"
  username: "collector"
  password_env: "MQTT_PASSWORD"
  qos: 1
  tls:
    ca_file: "../../infrastructure/docker/mqtt-broker/certs/ca.crt"
  reconnect:
    initial: 1s
    max: 60s

devices:
  - id: "dev-001"
    host: "127.0.0.1"
    port: 1161
    community_env: "SNMP_COMMUNITY_DEV_001"
    version: "2c"
    vendor: ""
