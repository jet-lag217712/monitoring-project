admin:
  listen: ":9091"

mqtt:
  broker: "tls://127.0.0.1:8883"
  client_id: "ingestion"
  username: "ingestion"
  password_env: "MQTT_PASSWORD"
  qos: 1
  topic: "site/+/device/+/metric/#"
  tls:
    ca_file: "../../infrastructure/docker/mqtt-broker/certs/ca.crt"
  reconnect:
    initial: 1s
    max: 60s

database:
  url_env: "DATABASE_URL"
  max_conns: 10
  min_conns: 1
  max_lifetime: 1h
