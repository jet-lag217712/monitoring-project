version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SITE-B-MDF
!
boot-start-marker
boot-end-marker
!
no aaa new-model
ip cef
!
no ip domain lookup
ip domain name lab.equate.local
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
username gns3 privilege 15 secret 5 gns3
!
!
!
interface Loopback0
 description OOB management loopback
 ip address 10.255.2.1 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description eBGP to DO-CORE GigabitEthernet2/0
 ip address 10.254.0.3 255.255.255.254
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 description Routed test LAN B-MDF via TEST-LANS-SW VLAN 20
 ip address 10.20.20.1 255.255.255.0
 negotiation auto
!
interface GigabitEthernet2/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet3/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet4/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet5/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet6/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
router bgp 65200
 bgp log-neighbor-changes
 network 10.20.20.0 mask 255.255.255.0
 network 10.255.2.1 mask 255.255.255.255
 aggregate-address 10.255.2.0 255.255.255.0 summary-only
 neighbor 10.254.0.2 remote-as 65000
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 10.254.0.2
!
access-list 10 permit 10.255.0.0 0.0.255.255
access-list 10 permit 192.168.103.1
!
snmp-server community EquateMonitor RO 10
snmp-server location Site B MDF
snmp-server contact Equate Network Operations
snmp-server enable traps snmp linkdown linkup coldstart warmstart
!
!
control-plane
!
banner motd C
Authorized access only.

Property of Equate Technologies

Version 4.0.0

!
line con 0
 exec-timeout 30 0
 logging synchronous
 login local
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login local
 transport input none
!
!
end