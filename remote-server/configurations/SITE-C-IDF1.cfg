version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SITE-C-IDF1
!
boot-start-marker
boot-end-marker
!
no aaa new-model
ip cef
!
no ip domain lookup
ip domain name lab.equate.local
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
username gns3 privilege 15 secret 5 gns3
!
!
!
interface Loopback0
 description OOB management loopback
 ip address 10.255.3.2 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description eBGP to SITE-C-MDF GigabitEthernet1/0
 ip address 10.254.3.0 255.255.255.254
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface FastEthernet1/0
 description Routed test LAN C-IDF1 via TEST-LANS-SW VLAN 31
 ip address 10.30.31.1 255.255.255.0
 speed auto
 duplex auto
!
interface FastEthernet1/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet2/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet2/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet3/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet3/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet4/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet4/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
