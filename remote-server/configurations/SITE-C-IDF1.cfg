!
router bgp 65301
 bgp log-neighbor-changes
 network 10.30.31.0 mask 255.255.255.0
 network 10.255.3.2 mask 255.255.255.255
 neighbor 10.254.3.1 remote-as 65300
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 10.254.3.1
!
access-list 10 permit 10.255.0.0 0.0.255.255
access-list 10 permit 192.168.103.1
!
ip prefix-list LOOPBACKS seq 5 permit 10.255.0.0/16 le 32
!
route-map LOOPBACKS-ONLY permit 10
 match ip address prefix-list LOOPBACKS
!
snmp-server community EquateMonitor RO 10
snmp-server location Site C IDF 1
snmp-server contact Equate Network Operations
snmp-server enable traps snmp linkdown linkup coldstart warmstart
!
!
control-plane
!
banner motd C
Authorized access only.

Property of Equate Technologies

Version 4.0.0

!
line con 0
 exec-timeout 30 0
 logging synchronous
 login local
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login local
 transport input none
!
!
end