! GNS3 C7200 monitoring-lab configuration
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
no service config
hostname SITE-C-IDF1
no ip domain-lookup
ip domain name lab.equate.local
ip routing
ip cef
no ip http server
no ip http secure-server
!
username gns3 privilege 15 secret 0 gns3
banner motd ^C
Authorized access only.

Property of Equate Technologies

Version 4.0.0
^C
!
ip access-list standard 10
 permit 10.255.0.0 0.0.0.255
 permit host 192.168.103.1
!
snmp-server community EquateMonitor RO 10
snmp-server contact Equate Network Operations
snmp-server location Site C IDF 1
snmp-server enable traps snmp linkdown linkup coldstart warmstart
!
interface Loopback0
 description OOB management loopback
 ip address 10.255.0.32 255.255.255.255
!
interface GigabitEthernet0/0
 description eBGP to SITE-C-MDF GigabitEthernet1/0
 ip address 10.254.3.0 255.255.255.254
 no shutdown
!
interface FastEthernet1/0
 description Routed test LAN C-IDF1 via TEST-LANS-SW VLAN 31
 ip address 10.30.31.1 255.255.255.0
 no shutdown
!
interface FastEthernet1/1
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet2/0
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet2/1
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet3/0
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet3/1
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet4/0
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet4/1
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet5/0
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet5/1
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet6/0
 description UNUSED - administratively shut down
 shutdown
!
interface FastEthernet6/1
 description UNUSED - administratively shut down
 shutdown
!
ip route 0.0.0.0 0.0.0.0 10.254.3.1
!
router bgp 65301
 bgp log-neighbor-changes
 neighbor 10.254.3.1 remote-as 65300
 network 10.255.0.32 mask 255.255.255.255
 network 10.30.31.0 mask 255.255.255.0
!
line con 0
 logging synchronous
 login local
 exec-timeout 30 0
line vty 0 4
 login local
 transport input none
!
end
