version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SITE-A-IDF2
!
boot-start-marker
boot-end-marker
!
no aaa new-model
ip cef
!
no ip domain lookup
ip domain name lab.equate.local
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
username gns3 privilege 15 secret 5 gns3
!
!
!
interface Loopback0
 description OOB management loopback
 ip address 10.255.1.3 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description eBGP to SITE-A-MDF GigabitEthernet2/0
 ip address 10.254.1.2 255.255.255.254
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface FastEthernet1/0
 description Routed test LAN A-IDF2 via TEST-LANS-SW VLAN 12
 ip address 10.10.12.1 255.255.255.0
 speed auto
 duplex auto
!
interface FastEthernet1/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet2/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet2/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet3/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet3/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet4/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet4/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet5/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet5/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet6/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet6/1
 description UNUSED - administratively shut down
 no ip address
 shutdown
 speed auto
 duplex auto
!
router bgp 65102
 bgp log-neighbor-changes
 network 10.10.12.0 mask 255.255.255.0
 network 10.255.1.3 mask 255.255.255.255
 redistribute ospf 1 route-map LOOPBACKS-ONLY
 neighbor 10.254.1.3 remote-as 65100
!
router ospf 1
 network 10.255.1.3 0.0.0.0 area 0
 network 10.254.1.2 0.0.0.1 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 10.254.1.3
!
access-list 10 permit 10.255.0.0 0.0.255.255
access-list 10 permit 192.168.103.1
!
ip prefix-list LOOPBACKS seq 5 permit 10.255.0.0/16 le 32
!
route-map LOOPBACKS-ONLY permit 10
 match ip address prefix-list LOOPBACKS
!
snmp-server community EquateMonitor RO 10
snmp-server location Site A IDF 2
snmp-server contact Equate Network Operations
snmp-server enable traps snmp linkdown linkup coldstart warmstart
!
!
control-plane
!
banner motd C
Authorized access only.

Property of Equate Technologies

Version 4.0.0

!
line con 0
 exec-timeout 30 0
 logging synchronous
 login local
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login local
 transport input none
!
!
end