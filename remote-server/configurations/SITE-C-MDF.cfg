! GNS3 C7200 monitoring-lab configuration
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
no service config
hostname SITE-C-MDF
no ip domain-lookup
ip domain name lab.equate.local
ip routing
ip cef
no ip http server
no ip http secure-server
!
username gns3 privilege 15 secret 0 CHANGE-ME-BEFORE-DEPLOYMENT
banner motd ^C
Authorized access only. Equate GNS3 monitoring lab.
^C
!
ip access-list standard 10
 permit 10.255.0.0 0.0.0.255
!
snmp-server community EquateMonitor RO 10
snmp-server contact Equate Network Operations
snmp-server location Site C MDF
snmp-server enable traps snmp linkdown linkup coldstart warmstart
!
interface Loopback0
 description OOB management loopback
 ip address 10.255.0.31 255.255.255.255
!
interface GigabitEthernet0/0
 description eBGP to DO-CORE GigabitEthernet3/0
 ip address 10.254.0.5 255.255.255.254
 no shutdown
!
interface GigabitEthernet1/0
 description eBGP to SITE-C-IDF1 GigabitEthernet0/0
 ip address 10.254.3.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet2/0
 description Routed test LAN C-MDF via TEST-LANS-SW VLAN 30
 ip address 10.30.30.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet3/0
 description UNUSED - administratively shut down
 shutdown
!
interface GigabitEthernet4/0
 description UNUSED - administratively shut down
 shutdown
!
interface GigabitEthernet5/0
 description UNUSED - administratively shut down
 shutdown
!
interface GigabitEthernet6/0
 description UNUSED - administratively shut down
 shutdown
!
router bgp 65300
 bgp log-neighbor-changes
 neighbor 10.254.0.4 remote-as 65000
 neighbor 10.254.3.0 remote-as 65301
 network 10.255.0.31 mask 255.255.255.255
 network 10.30.30.0 mask 255.255.255.0
!
line con 0
 logging synchronous
 login local
 exec-timeout 30 0
line vty 0 4
 login local
 transport input none
!
end
