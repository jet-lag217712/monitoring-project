version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SITE-A-MDF
!
boot-start-marker
boot-end-marker
!
no aaa new-model
ip cef
!
no ip domain lookup
ip domain name lab.equate.local
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
username gns3 privilege 15 secret 5 gns3
!
!
!
interface Loopback0
 description OOB management loopback
 ip address 10.255.1.1 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description eBGP to DO-CORE GigabitEthernet1/0
 ip address 10.254.0.1 255.255.255.254
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 description eBGP to SITE-A-IDF1 GigabitEthernet0/0
 ip address 10.254.1.1 255.255.255.254
 negotiation auto
!
interface GigabitEthernet2/0
 description eBGP to SITE-A-IDF2 GigabitEthernet0/0
 ip address 10.254.1.3 255.255.255.254
 negotiation auto
!
interface GigabitEthernet3/0
 description Routed test LAN A-MDF via TEST-LANS-SW VLAN 10
 ip address 10.10.10.1 255.255.255.0
 negotiation auto
!
interface GigabitEthernet4/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet5/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet6/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
router bgp 65100
 bgp log-neighbor-changes
 network 10.10.10.0 mask 255.255.255.0
 network 10.255.1.1 mask 255.255.255.255
 aggregate-address 10.255.1.0 255.255.255.0 summary-only
 redistribute ospf 1 route-map LOOPBACKS-ONLY
 neighbor 10.254.0.0 remote-as 65000
 neighbor 10.254.1.0 remote-as 65101
 neighbor 10.254.1.2 remote-as 65102
!
router ospf 1
 network 10.255.1.1 0.0.0.0 area 0
 network 10.254.1.1 0.0.0.1 area 0
 network 10.254.1.3 0.0.0.1 area 0
!
ip forward-protocol nd
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 10.254.0.0
!
access-list 10 permit 10.255.0.0 0.0.255.255
access-list 10 permit 192.168.103.1
!
ip prefix-list LOOPBACKS seq 5 permit 10.255.0.0/16 le 32
!
route-map LOOPBACKS-ONLY permit 10
 match ip address prefix-list LOOPBACKS
!
snmp-server community EquateMonitor RO 10
snmp-server location Site A MDF
snmp-server contact Equate Network Operations
snmp-server enable traps snmp linkdown linkup coldstart warmstart
!
!
control-plane
!
banner motd C
Authorized access only.

Property of Equate Technologies

Version 4.0.0

!
line con 0
 exec-timeout 30 0
 logging synchronous
 login local
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login local
 transport input none
!
!
end