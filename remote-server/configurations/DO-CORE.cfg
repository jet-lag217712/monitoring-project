version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname DO-CORE
!
boot-start-marker
boot-end-marker
!
no aaa new-model
ip cef
!
no ip domain lookup
ip domain name lab.equate.local
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
username gns3 privilege 15 secret 5 gns3
!
!
!
interface Loopback0
 description OOB management loopback
 ip address 10.255.0.1 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description GNS3 NAT DHCP Internet handoff (NAT outside)
 ip address dhcp
 ip nat outside
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 description eBGP to SITE-A-MDF GigabitEthernet0/0
 ip address 10.254.0.0 255.255.255.254
 ip nat inside
 negotiation auto
!
interface GigabitEthernet2/0
 description eBGP to SITE-B-MDF GigabitEthernet0/0
 ip address 10.254.0.2 255.255.255.254
 ip nat inside
 negotiation auto
!
interface GigabitEthernet3/0
 description eBGP to SITE-C-MDF GigabitEthernet0/0
 ip address 10.254.0.4 255.255.255.254
 ip nat inside
 negotiation auto
!
interface GigabitEthernet4/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet5/0
 description MacBook GNS3 Cloud management handoff
 ip address 192.168.103.2 255.255.255.0
 negotiation auto
!
interface GigabitEthernet6/0
 description UNUSED - administratively shut down
 no ip address
 shutdown
 negotiation auto
!
router bgp 65000
 bgp log-neighbor-changes
 network 0.0.0.0
 network 10.255.0.0 mask 255.255.255.0
 network 10.255.0.1 mask 255.255.255.255
 neighbor 10.254.0.1 remote-as 65100
 neighbor 10.254.0.3 remote-as 65200
 neighbor 10.254.0.5 remote-as 65300
!
ip nat inside source list NAT-INSIDE-10 interface GigabitEthernet0/0 overload
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 10.255.0.0 255.255.255.0 Null0
ip route 0.0.0.0 0.0.0.0 dhcp
!
ip access-list standard NAT-INSIDE-10
 permit 10.0.0.0 0.255.255.255
!
access-list 10 permit 10.255.0.0 0.0.255.255
access-list 10 permit 192.168.103.1
!
snmp-server community EquateMonitor RO 10
snmp-server location District Office Core
snmp-server contact Equate Network Operations
snmp-server enable traps snmp linkdown linkup coldstart warmstart
!
!
control-plane
!
banner motd C
Authorized access only.

Property of Equate Technologies

Version 4.0.0

!
line con 0
 exec-timeout 30 0
 logging synchronous
 login local
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login local
 transport input none
!
!
end